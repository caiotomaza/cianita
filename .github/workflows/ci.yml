name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, dom, pdo_sqlite, sqlite3, xml, curl, fileinfo
          coverage: none
      - name: Validar manifesto e lockfile Composer
        run: composer validate --strict --no-check-publish
      - name: Instalar dependências PHP travadas
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Auditar dependências PHP
        run: composer audit --locked
      - name: Verificar sintaxe PHP
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verificar padrão PHP
        run: vendor/bin/pint --test
      - name: Executar PHPUnit
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências JS travadas
        run: npm ci --no-audit --no-fund
      - name: Auditar dependências JS
        run: npm audit --audit-level=high
      - name: Verificar tipos
        run: npm run typecheck
      - name: Build de frontend
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Identificar digests das imagens de base
        shell: bash
        run: |
          for image in \
            node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee \
            dunglas/frankenphp:1-php8.4-bookworm@sha256:bd101be4e0f384dba7da85bfc8d13911998b4fee4ed42ec7959dc0e67619c161 \
            composer:2@sha256:ca11f643d7791ebdd90a34fc20caf11380d434007ae539a9ea75cd9212e13dca \
            postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7 \
            redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe; do
            echo "Imagem $image"
            docker buildx imagetools inspect "$image" | sed -n '1,7p'
          done
      - name: Preparar variáveis efêmeras
        run: |
          cp .env.example .env
          db_password="$(openssl rand -hex 24)"
          sed -i "s/^DB_PASSWORD=$/DB_PASSWORD=$db_password/" .env
          chmod 600 .env
          key="$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$key|" .env
          docker compose config --quiet
      - name: Build de contêiner a partir dos lockfiles
        run: docker compose build app
      - name: Migrations em PostgreSQL e smoke HTTP
        run: |
          docker compose up -d db redis
          docker compose run --rm app php artisan migrate --force
          docker compose run --rm app php artisan migrate:status
          docker compose up -d app
          ok=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/up >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/login
      - name: Smoke HTTP autenticado com dados sintéticos
        env:
          CIANITA_SMOKE_LAB: '1'
        run: python3 scripts/smoke_laboratorio.py
      - name: Logs saneados em caso de falha
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=50 app db redis
      - name: Encerrar contêineres preservando volumes
        if: always()
        run: docker compose down

  postgres-integrity:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cianita_test
          POSTGRES_USER: cianita_ci
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cianita_ci -d cianita_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: cianita_test
      DB_USERNAME: cianita_ci
      DB_PASSWORD: ci-test-only
      DB_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, dom, pdo_pgsql, xml, curl, fileinfo, pcntl, posix
          coverage: none
      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validar padrao PHP para a nova persistencia
        run: vendor/bin/pint --test
      - name: Testes de revisoes, falhas e autorizacao em PostgreSQL 17
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --filter='(NoteConsistencyTest|VaultAndNoteTest)'
      - name: SIGKILL real e reconciliação em PostgreSQL descartável
        env:
          APP_ENV: testing
          CIANITA_CRASH_TEST: '1'
        run: |
          php artisan migrate --force
          php tests/integration/crash_notes_process.php
